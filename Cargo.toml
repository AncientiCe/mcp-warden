[package]
name = "mcp-warden"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
indexmap = "2.14.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync"] }
which = "8.0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
