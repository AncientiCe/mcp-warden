name: Update Homebrew Formula

# Runs after the Release workflow finishes. A `release: published` trigger does
# NOT fire here, because that release is created by the Release workflow using
# the default GITHUB_TOKEN, and GitHub never starts new workflow runs from
# GITHUB_TOKEN-triggered events. `workflow_run` is not subject to that rule, so
# it reliably chains after a tagged release build. `workflow_dispatch` is a
# manual fallback (pass the tag, e.g. v0.2.0).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish to Homebrew (e.g. v0.2.0)"
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # For tag-triggered runs, head_branch is the tag name (e.g. v0.2.0).
          RAW="${DISPATCH_VERSION:-$RUN_TAG}"
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a release version: ${RAW}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        id: checksums
        run: |
          set -euo pipefail
          base="https://github.com/AncientiCe/mcp-warden/releases/download/v${{ steps.version.outputs.version }}"
          for pair in macos_arm:aarch64-apple-darwin macos_intel:x86_64-apple-darwin \
                      linux_arm:aarch64-unknown-linux-gnu linux_intel:x86_64-unknown-linux-gnu; do
            key="${pair%%:*}"
            target="${pair#*:}"
            sum="$(curl -fsSL "${base}/mcp-warden-${target}.sha256" | awk '{print $1}')"
            if ! printf '%s' "$sum" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "Invalid checksum for ${target}: ${sum}" >&2
              exit 1
            fi
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
            echo "${target}: ${sum}"
          done

      - name: Checkout homebrew-mcp-warden
        uses: actions/checkout@v4
        with:
          repository: AncientiCe/homebrew-mcp-warden
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-mcp-warden

      - name: Update formula
        run: |
          set -euo pipefail
          cd homebrew-mcp-warden
          formula=Formula/mcp-warden.rb
          VERSION=${{ steps.version.outputs.version }}

          sed -i "s|download/v[0-9][0-9.]*/|download/v${VERSION}/|g" "$formula"
          sed -i -E "s/mcp-warden-[0-9][0-9.]*-(aarch64|x86_64)-/mcp-warden-${VERSION}-\1-/g" "$formula"

          # Update sha256 lines in declaration order: macOS ARM64, macOS Intel,
          # Linux ARM64, Linux x86_64. Match only real `sha256 "..."` lines.
          awk \
            -v s1="${{ steps.checksums.outputs.macos_arm }}" \
            -v s2="${{ steps.checksums.outputs.macos_intel }}" \
            -v s3="${{ steps.checksums.outputs.linux_arm }}" \
            -v s4="${{ steps.checksums.outputs.linux_intel }}" '
            /^[[:space:]]*sha256 "/ {
              n++
              sum = (n == 1) ? s1 : (n == 2) ? s2 : (n == 3) ? s3 : (n == 4) ? s4 : ""
              if (sum != "") { sub(/sha256 ".*"/, "sha256 \"" sum "\"") }
            }
            { print }
            END { if (n != 4) { print "expected 4 sha256 lines, found " n > "/dev/stderr"; exit 1 } }
          ' "$formula" > "$formula.tmp"
          mv "$formula.tmp" "$formula"
          git diff

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-mcp-warden
          commit-message: "mcp-warden ${{ steps.version.outputs.version }}"
          title: "mcp-warden ${{ steps.version.outputs.version }}"
          body: |
            Automated update for mcp-warden v${{ steps.version.outputs.version }}.

            - macOS ARM64 SHA256: `${{ steps.checksums.outputs.macos_arm }}`
            - macOS Intel SHA256: `${{ steps.checksums.outputs.macos_intel }}`
            - Linux ARM64 SHA256: `${{ steps.checksums.outputs.linux_arm }}`
            - Linux x86_64 SHA256: `${{ steps.checksums.outputs.linux_intel }}`

            Release: https://github.com/AncientiCe/mcp-warden/releases/tag/v${{ steps.version.outputs.version }}
          branch: update-v${{ steps.version.outputs.version }}
          delete-branch: true
